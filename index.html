<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPlay Engine PRO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="engine-header">
    <h1>🚀 DevPlay Engine PRO</h1>

    <div class="action-buttons">
        <button id="run-btn" class="btn btn-run">تشغيل</button>
        <button id="reset-btn" class="btn btn-reset">إعادة</button>
    </div>
</header>

<main class="main-workspace">

    <section class="editor-panel">
        <div class="panel-header">
            <span>main.js</span>
        </div>

        <div class="editor-wrapper">
            <textarea id="code-editor"></textarea>
        </div>
    </section>

    <section class="preview-panel">

        <div class="panel-header">
            <h3>📺 شاشة العرض</h3>
        </div>

        <div class="viewport-container">
            <canvas id="gameCanvas" width="700" height="450"></canvas>
        </div>

    </section>

</main>

<footer class="engine-footer">
    <span>جاهز للعمل ✅</span>
</footer>

<!-- هنا التصليح -->
<script src="app.js"></script>

</body>
</html>
